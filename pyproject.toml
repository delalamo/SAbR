[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "sabr-kit"
dynamic = ["version"]
description = "Structure-based Antibody Renumbering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

authors = [
  { name = "Diego del Alamo" },
]

dependencies = [
  "biopython>=1.87,<2",
  "click>=8.4.2,<9",
  "numpy>=2.4.6,<3",
  "scipy>=1.17.1,<2"
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "coverage>=7.15.0,<8",
  "pre-commit>=4.6.0,<5",
]

[project.urls]
Homepage = "https://github.com/delalamo/sabr"
Issues = "https://github.com/delalamo/sabr/issues"

[project.scripts]
sabr = "sabr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sabr"]

[tool.hatch.build]
include = [
  "src/sabr/**",
  "README.md",
  "LICENSE"
]

[tool.hatch.version]
source = "vcs"

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 80

[tool.flake8]
max-line-length = 80
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["src/sabr/_anarci/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
