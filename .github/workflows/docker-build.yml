name: Build and Publish Docker Image on Release

on:
  release:
    types: [published] # Trigger when a GitHub Release is published
  push:
    tags:
      - "v*" # Or whenever a tag starting with v is pushed
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (leave blank to use the latest v* tag)"
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout container definition
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve source tag and image name
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUSH_TAG: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          case "$EVENT_NAME" in
            release)
              SOURCE_TAG="$RELEASE_TAG"
              ;;
            push)
              SOURCE_TAG="$PUSH_TAG"
              ;;
            workflow_dispatch)
              SOURCE_TAG="$REQUESTED_TAG"
              if [ -z "$SOURCE_TAG" ]; then
                SOURCE_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
              fi
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$SOURCE_TAG" != v* ]]; then
            echo "Expected a v* Git tag, got: $SOURCE_TAG" >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${SOURCE_TAG}^{commit}" >/dev/null; then
            echo "Git tag does not exist: $SOURCE_TAG" >&2
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse "refs/tags/${SOURCE_TAG}^{commit}")"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          IMAGE_NAME="ghcr.io/${REPO,,}"
          VERSION_TAG="${SOURCE_TAG#v}"
          echo "source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.vars.outputs.source_sha }}
          path: release-source
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version_tag }}
            type=raw,value=latest

      - name: Build local release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            SOURCE_DIR=release-source
            SABR_VERSION=${{ steps.vars.outputs.version_tag }}
          tags: sabr:release
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the release image before publication
        env:
          EXPECTED_VERSION: ${{ steps.vars.outputs.version_tag }}
          IMAGE: ${{ steps.build.outputs.imageid }}
        run: bash scripts/test_container.sh "$IMAGE" release-source "$EXPECTED_VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image without rebuilding
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag "$IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
