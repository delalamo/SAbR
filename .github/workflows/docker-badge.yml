name: Docker image freshness

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_run:
    workflows: [Build and Publish Docker Image on Release]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-badge:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    concurrency:
      group: publish-readme-badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare published image with the newest version tag
        env:
          BADGE_OUTPUT: ${{ runner.temp }}/badges
          IMAGE_CONFIG: ${{ runner.temp }}/image.json
        run: |
          LATEST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          LATEST_REVISION=""
          if [ -n "$LATEST_TAG" ]; then
            LATEST_REVISION="$(git rev-parse "refs/tags/${LATEST_TAG}^{commit}")"
          fi
          if ! docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}:latest" \
            --format '{{json .Image}}' > "$IMAGE_CONFIG"; then
            echo '::warning::Could not inspect the published Docker image.'
            echo '{}' > "$IMAGE_CONFIG"
          fi
          python .github/scripts/readme_badges.py docker "$IMAGE_CONFIG" \
            "$LATEST_TAG" "$LATEST_REVISION" "$BADGE_OUTPUT/docker.json"
          bash .github/scripts/publish-badges.sh "$BADGE_OUTPUT"
