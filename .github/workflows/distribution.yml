name: Validate built distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt build
      # Build the wheel from the sdist, as python -m build does by default.
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/sabr-wheel-test"
          "$RUNNER_TEMP/sabr-wheel-test/bin/python" -m pip install -c constraints.txt dist/*.whl pytest pytest-cov
          "$RUNNER_TEMP/sabr-wheel-test/bin/python" -m pip check
      - name: Run the full suite against the installed wheel
        run: '"$RUNNER_TEMP/sabr-wheel-test/bin/python" -I -m pytest --cov=sabr'
      - name: Renumber a structure with the installed CLI and check the result
        run: '"$RUNNER_TEMP/sabr-wheel-test/bin/python" -I scripts/smoke_test.py tests/data'
