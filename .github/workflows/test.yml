name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.txt pre-commit
      - run: pre-commit run --all-files

  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e '.[test]'
      - run: JAX_PLATFORMS=cpu pytest --cov=sabr --cov-report=term-missing --cov-report=json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage
          path: coverage.json
          if-no-files-found: error

  badge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'

  coverage-badge:
    needs: [lint, test, wheel, badge-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-readme-badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
      - name: Publish measured coverage
        env:
          BADGE_OUTPUT: ${{ runner.temp }}/badges
          COVERAGE_REPORT: ${{ runner.temp }}/coverage/coverage.json
        run: |
          MAIN_REVISION="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$GITHUB_SHA" != "$MAIN_REVISION" ]; then
            echo 'Skipping coverage publication for a superseded main revision.'
            exit 0
          fi
          python .github/scripts/readme_badges.py coverage "$COVERAGE_REPORT" "$BADGE_OUTPUT/coverage.json"
          bash .github/scripts/publish-badges.sh "$BADGE_OUTPUT"

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt build
      - run: python -m build
      - run: python -m venv /tmp/sabr-wheel-test
      - run: /tmp/sabr-wheel-test/bin/pip install -c constraints.txt dist/*.whl
      - run: /tmp/sabr-wheel-test/bin/python -c "import sabr"
      - run: /tmp/sabr-wheel-test/bin/sabr --help
      - run: /tmp/sabr-wheel-test/bin/sabr --version
