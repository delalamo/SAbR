name: Python checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.txt pre-commit
      - run: pre-commit run --all-files

  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e '.[test]'
      - run: pytest --cov=sabr
      - name: Report the curated biological benchmark
        if: matrix.python-version == '3.12'
        run: |
          python -m benchmarks.antibody.run --output benchmark-sabr.json
          python -m benchmarks.antibody.run --mode softalign --output benchmark-softalign.json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: antibody-benchmark
          path: benchmark-*.json

  wheel:
    uses: ./.github/workflows/distribution.yml
